services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: aacharya-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "5001:5000"
      CLIENT_URL: http://localhost:8080
      LOG_LEVEL: info
    ports:
      - "5000:5000"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: aacharya-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server